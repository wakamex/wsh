name: validation

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  floor-bundle:
    name: Bundle, PTY, and portability
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install host build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman zsh
      - name: Build and test the development bundle on the glibc 2.28 floor
        run: ./build/build-glibc-2.28-development-bundle.zsh

  retained-resource-gates:
    name: Retained benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install evidence-checker requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes gawk jq zsh python3-yaml
      - name: Verify the retained accepted evidence
        run: ./benchmarks/verify-retained-evidence.zsh

  validate:
    name: validate
    if: always()
    needs:
      - floor-bundle
      - retained-resource-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to pass
        env:
          FLOOR_RESULT: ${{ needs.floor-bundle.result }}
          RESOURCE_RESULT: ${{ needs.retained-resource-gates.result }}
        run: test "$FLOOR_RESULT" = success && test "$RESOURCE_RESULT" = success
