name: validation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-bundle:
    name: Bundle, PTY, and portability
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install host build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman zsh
      - name: Build and test the development bundle on the glibc 2.28 floor
        run: ./build/build-glibc-2.28-development-bundle.zsh

  source-rpm:
    name: Source RPM and offline Fedora rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install source-package tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman zsh rpm
      - name: Build source RPM and rebuild without network access
        env:
          WSH_SOURCE_RPM_STATUS: ${{ github.event_name == 'pull_request' && 'development' || 'release' }}
        run: ./packaging/test-source-rpm.zsh "$RUNNER_TEMP/source-rpm"
      - name: Retain build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-rpm-results
          path: |
            ${{ runner.temp }}/source-rpm/*.log
            ${{ runner.temp }}/source-rpm/builder.json
            ${{ runner.temp }}/source-rpm/source/SRPMS/
            ${{ runner.temp }}/source-rpm/rebuild/RPMS/
            ${{ runner.temp }}/source-rpm/rebuild/packages.txt
            ${{ runner.temp }}/source-rpm/rebuild/*.log
            ${{ runner.temp }}/source-rpm/rebuild/BUILD/**/.rpm-build/native-build.log
            ${{ runner.temp }}/source-rpm/rebuild/BUILD/**/.rpm-build/checks/**/*.log
            ${{ runner.temp }}/source-rpm/rebuild/BUILD/**/.rpm-build/checks/**/*.json
          include-hidden-files: true
          if-no-files-found: warn

  ubuntu-host:
    name: Build and test on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build requirements from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf gcc make patch jq curl git python3 zsh \
            libncurses-dev libcap-dev libpcre2-dev libjansson-dev zlib1g-dev
      - name: Build and test the installation with the host toolchain
        env:
          WSH_TEST_RPM: '0'
          WSH_NATIVE_OUTPUT_ROOT: ${{ runner.temp }}/wsh
        run: zsh ./build/test-native-installation.zsh

  macos-host:
    name: Build and test on macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build requirements from Homebrew
        run: |
          brew install autoconf coreutils gnu-sed gnu-tar jq jansson pcre2
          prefix=$(brew --prefix)
          # The build scripts use GNU coreutils, sed and tar options.
          for tool in coreutils gnu-sed gnu-tar; do echo "$prefix/opt/$tool/libexec/gnubin" >> "$GITHUB_PATH"; done
          echo "CPPFLAGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$prefix/lib" >> "$GITHUB_ENV"
      - name: Build and test the installation with the host toolchain
        env:
          WSH_TEST_RPM: '0'
          WSH_NATIVE_OUTPUT_ROOT: ${{ runner.temp }}/wsh
        run: zsh ./build/test-native-installation.zsh
      - name: Retain build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-results
          path: |
            ${{ runner.temp }}/wsh/build.log
            ${{ runner.temp }}/wsh/checks.*/**/*.log
          if-no-files-found: warn

  homebrew-macos:
    name: Homebrew formula on macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and test the formula from a source archive of this commit
        run: |
          # The same archive the release attaches: git archive with a zero gzip timestamp.
          version=$(cat VERSION)
          archive="$RUNNER_TEMP/wsh-v$version-source.tar.gz"
          python3 -c 'import gzip,subprocess,sys; sys.stdout.buffer.write(gzip.compress(subprocess.run(["git","archive","--format=tar","--prefix=wsh-"+sys.argv[1]+"/","HEAD"],capture_output=True,check=True).stdout,compresslevel=9,mtime=0))' "$version" > "$archive"
          sha=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          brew tap-new --no-git wakamex/local
          tap=$(brew --repository wakamex/local)
          python3 packaging/homebrew/render-formula.py "file://$archive" "$sha" "$(git rev-parse HEAD)" "$tap/Formula/wsh.rb"
          brew install --build-from-source --verbose wakamex/local/wsh
          brew test wakamex/local/wsh
          brew linkage wakamex/local/wsh
      - name: Show the end of the Homebrew build logs
        if: failure()
        run: for f in ~/Library/Logs/Homebrew/wsh/*; do echo "== $f"; grep -aE "Test/|failed|FAIL|successful test scripts|was expecting|Error" "$f" | tail -40; done
      - name: Retain the Homebrew build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-logs
          path: ~/Library/Logs/Homebrew/wsh/
          if-no-files-found: warn

  source-contracts:
    name: Current source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install source-check requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes git zsh python3-yaml gcc
      - name: Verify current source contracts
        run: ./tests/verify-current.zsh

  validate:
    name: validate
    if: always()
    needs:
      - floor-bundle
      - source-rpm
      - ubuntu-host
      - macos-host
      - homebrew-macos
      - source-contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to pass
        env:
          FLOOR_RESULT: ${{ needs.floor-bundle.result }}
          SOURCE_RPM_RESULT: ${{ needs.source-rpm.result }}
          UBUNTU_RESULT: ${{ needs.ubuntu-host.result }}
          MACOS_RESULT: ${{ needs.macos-host.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew-macos.result }}
          SOURCE_CONTRACTS_RESULT: ${{ needs.source-contracts.result }}
        run: |
          test "$FLOOR_RESULT" = success && test "$SOURCE_RPM_RESULT" = success && test "$UBUNTU_RESULT" = success
          test "$MACOS_RESULT" = success && test "$HOMEBREW_RESULT" = success && test "$SOURCE_CONTRACTS_RESULT" = success
