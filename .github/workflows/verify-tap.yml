name: verify-tap

# Install a published version from the Homebrew tap on a clean macOS runner, after release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version, such as 0.4.8
        required: true

permissions:
  contents: read

jobs:
  install:
    name: Install wsh from wakamex/tap
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Install from the tap and test
        env:
          VERSION: ${{ inputs.version }}
        run: |
          brew install wakamex/tap/wsh
          brew test wakamex/tap/wsh
          "$(brew --prefix)/bin/wsh" --wsh-version | grep -F "wsh $VERSION "
          brew info wakamex/tap/wsh
      - name: Retain the Homebrew build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-logs
          path: ~/Library/Logs/Homebrew/wsh/
          if-no-files-found: warn
