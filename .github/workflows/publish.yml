name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  authorize:
    name: Validate the deliberate release tag
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install the script runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Install and verify the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          ./build/verify-rust-toolchain.zsh
      - name: Require an eligible main commit and matching annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./build/check-release-eligibility.zsh "$RELEASE_TAG"
          test -f "release-notes/${RELEASE_TAG}.md"
          test ! -L "release-notes/${RELEASE_TAG}.md"
          test -s "release-notes/${RELEASE_TAG}.md"

  build:
    name: Canonical build ${{ matrix.worker }}
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        worker:
          - a
          - b
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install host build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman zsh
      - name: Install and verify the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          ./build/verify-rust-toolchain.zsh
      - name: Fetch the digest-pinned floor image
        run: podman pull "$(./build/resolve-glibc-2.28-builder.zsh)"
      - name: Run the canonical release build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          ./build/build-glibc-2.28-release-bundle.zsh "$RELEASE_TAG" 2>&1 | tee "$RUNNER_TEMP/release-build.log"
      - name: Collect the release candidate and build record
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WORKER: ${{ matrix.worker }}
        run: |
          ./build/collect-release-build.zsh "$RELEASE_TAG" "$WORKER" "release-build-$WORKER"
          cp "$RUNNER_TEMP/release-build.log" "release-build-$WORKER/"
      - name: Upload the isolated build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-${{ matrix.worker }}
          path: release-build-${{ matrix.worker }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain a failed build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-release-build-${{ matrix.worker }}
          path: ${{ runner.temp }}/release-build.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Compare, attest, and publish
    needs:
      - authorize
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download canonical build a
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-build-a
          path: incoming/a
      - name: Download canonical build b
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-build-b
          path: incoming/b
      - name: Require byte-identical release outputs
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives_a < <(find incoming/a -maxdepth 1 -type f -name '*.tar.xz' -print)
          mapfile -t archives_b < <(find incoming/b -maxdepth 1 -type f -name '*.tar.xz' -print)
          mapfile -t manifests_a < <(find incoming/a -maxdepth 1 -type f -name '*.manifest.json' -print)
          mapfile -t manifests_b < <(find incoming/b -maxdepth 1 -type f -name '*.manifest.json' -print)
          mapfile -t launchers_a < <(find incoming/a -maxdepth 1 -type f -name 'wsh-launcher-*' -print)
          mapfile -t launchers_b < <(find incoming/b -maxdepth 1 -type f -name 'wsh-launcher-*' -print)
          mapfile -t installers_a < <(find incoming/a -maxdepth 1 -type f -name 'wsh-install-*' -print)
          mapfile -t installers_b < <(find incoming/b -maxdepth 1 -type f -name 'wsh-install-*' -print)
          mapfile -t bootstraps_a < <(find incoming/a -maxdepth 1 -type f -name 'wsh-v*-install.sh' -print)
          mapfile -t bootstraps_b < <(find incoming/b -maxdepth 1 -type f -name 'wsh-v*-install.sh' -print)
          test "${#archives_a[@]}" -eq 1
          test "${#archives_b[@]}" -eq 1
          test "${#manifests_a[@]}" -eq 1
          test "${#manifests_b[@]}" -eq 1
          test "${#launchers_a[@]}" -eq 1
          test "${#launchers_b[@]}" -eq 1
          test "${#installers_a[@]}" -eq 1
          test "${#installers_b[@]}" -eq 1
          test "${#bootstraps_a[@]}" -eq 1
          test "${#bootstraps_b[@]}" -eq 1
          test "${archives_a[0]##*/}" = "${archives_b[0]##*/}"
          test "${manifests_a[0]##*/}" = "${manifests_b[0]##*/}"
          test "${launchers_a[0]##*/}" = "${launchers_b[0]##*/}"
          test "${installers_a[0]##*/}" = "${installers_b[0]##*/}"
          test "${bootstraps_a[0]##*/}" = "${bootstraps_b[0]##*/}"
          cmp --silent "${archives_a[0]}" "${archives_b[0]}"
          cmp --silent "${manifests_a[0]}" "${manifests_b[0]}"
          cmp --silent "${launchers_a[0]}" "${launchers_b[0]}"
          cmp --silent "${installers_a[0]}" "${installers_b[0]}"
          cmp --silent "${bootstraps_a[0]}" "${bootstraps_b[0]}"
          mkdir release-assets
          cp "${archives_a[0]}" "${manifests_a[0]}" "${launchers_a[0]}" "${installers_a[0]}" "${bootstraps_a[0]}" release-assets/
          cp "${bootstraps_a[0]}" release-assets/wsh-install.sh
          cmp --silent "${bootstraps_a[0]}" release-assets/wsh-install.sh
          cp incoming/a/build-record-a.json incoming/b/build-record-b.json release-assets/
          (
            cd release-assets
            sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS
          )
          printf '%s\n' \
            "${archives_a[0]##*/}" \
            "${manifests_a[0]##*/}" \
            "${launchers_a[0]##*/}" \
            "${installers_a[0]##*/}" \
            "${bootstraps_a[0]##*/}" \
            wsh-install.sh \
            | LC_ALL=C sort > product-assets.txt
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > attested-assets.txt
      - name: Install the release-verification GitHub CLI
        env:
          GH_ARCHIVE_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          GH_VERSION: 2.96.0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory="$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Attest every release asset
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: release-assets/*
      - name: Stage the offline build-provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: install -m 644 "$ATTESTATION_BUNDLE" "release-assets/wsh-${RELEASE_TAG}-build-provenance.sigstore.json"
      - name: Verify the build attestations before publication
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r asset; do
            gh attestation verify "release-assets/$asset" \
              --bundle "$ATTESTATION_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done < attested-assets.txt
      - name: Publish or confirm the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="release-notes/${RELEASE_TAG}.md"
          if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>release-error.txt); then
            jq -e --arg tag "$RELEASE_TAG" --rawfile notes "$notes_file" '.tag_name == $tag and .name == $tag and .draft == false and .prerelease == false and .immutable == true and .body == $notes' <<<"$release" >/dev/null
            find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > expected-assets.txt
            jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort > published-assets.txt
            cmp --silent expected-assets.txt published-assets.txt
            mkdir existing-release
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing-release
            gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
            (
              cd existing-release
              sha256sum --check --strict SHA256SUMS
            )
            for worker in a b; do
              record="existing-release/build-record-${worker}.json"
              jq -e \
                --arg worker "$worker" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg source_revision "$GITHUB_SHA" \
                --arg release_tag "$RELEASE_TAG" \
                '.format_version == 1
                  and .worker == $worker
                  and .repository == $repository
                  and .source_revision == $source_revision
                  and .release_id == $release_tag
                  and .workflow.sha == $source_revision
                  and .workflow.ref == ($repository + "/.github/workflows/publish.yml@refs/tags/" + $release_tag)
                  and (.workflow.run_id | type == "string" and length > 0)
                  and (.workflow.run_attempt | type == "string" and length > 0)
                  and (.outputs | length == 5)' \
                "$record" >/dev/null
              while IFS=$'\t' read -r asset digest; do
                printf '%s  %s\n' "$digest" "existing-release/$asset" | sha256sum --check --status
              done < <(jq -r '.outputs[] | [.name, .sha256] | @tsv' "$record")
            done
            provenance="existing-release/wsh-${RELEASE_TAG}-build-provenance.sigstore.json"
            while IFS= read -r asset; do
              gh attestation verify "existing-release/$asset" \
                --bundle "$provenance" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
                --signer-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF" \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners
            done < <(sed -n 's/^[0-9a-f]\{64\}  //p' existing-release/SHA256SUMS; printf '%s\n' SHA256SUMS)
            while IFS= read -r asset; do
              cmp --silent "release-assets/$asset" "existing-release/$asset"
            done < product-assets.txt
            mv release-assets fresh-release-assets
            mv existing-release release-assets
          elif grep -F '(HTTP 404)' release-error.txt >/dev/null; then
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$notes_file" --title "$RELEASE_TAG"
          else
            cat release-error.txt >&2
            exit 1
          fi
      - name: Retain the exact published asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  verify:
    name: Verify the public release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Check out the annotated tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download the exact publication candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: published-release-assets
          path: release-assets
      - name: Install verification requirements
        env:
          GH_ARCHIVE_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          GH_VERSION: 2.96.0
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq zsh
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory="$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Verify the published release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="release-notes/${RELEASE_TAG}.md"
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          jq -e --arg tag "$RELEASE_TAG" --rawfile notes "$notes_file" '.tag_name == $tag and .name == $tag and .draft == false and .prerelease == false and .immutable == true and .body == $notes' <<<"$release" >/dev/null
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > expected-assets.txt
          jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort > published-assets.txt
          cmp --silent expected-assets.txt published-assets.txt
          verified=0
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" -eq 1
          for asset in release-assets/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Verify the stable bootstrap alias
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Skipping the stable bootstrap alias because ${RELEASE_TAG} is not the latest release (${latest_tag})."
            exit 0
          fi
          latest_bootstrap="$RUNNER_TEMP/wsh-install.sh"
          latest_matches=0
          for attempt in $(seq 1 12); do
            if curl --disable --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$latest_bootstrap" "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/wsh-install.sh" \
              && cmp --silent "$latest_bootstrap" "release-assets/wsh-${RELEASE_TAG}-install.sh"; then
              latest_matches=1
              break
            fi
            sleep 5
          done
          test "$latest_matches" -eq 1
      - name: Install and launch from the public release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          trap 'rm -rf -- "$smoke_root"' EXIT
          source_revision=$(git rev-parse HEAD)
          ./benchmarks/benchmark-public-install.zsh "$smoke_root/public-install.tsv" github-actions "$RELEASE_TAG" "$source_revision" 1
          cat "$smoke_root/public-install.tsv"
