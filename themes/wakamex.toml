schema-version = 1
id = "wakamex"
name = "Wakamex"
left = ["context", "cwd", "git", "duration", "prompt-character"]
right = []

[context]
enabled = true
show-local = false
show-ssh = true
prefix = "["
separator = "@"
suffix = "]"
color = "default"

[cwd]
enabled = true
style = "full"
show-on-change = true
max-length = 50
home-symbol = "~"
color = "bright-black"

[git]
enabled = true
compact = true
hide-branches = ["main", "master"]
prefix = ""
separator = ""
color = "bright-black"

[git.symbols]
branch = ""
detached = "➦ "
tag = "◈ "
clean = "±"
staged = "+"
modified = "!"
untracked = "?"
ahead = "↱"
behind = "↰"
diverged = "⇅"
rebase = ">R>"
merge = ">M<"
cherry-pick = ">C>"
revert = "<R>"
bisect = "<B>"

[duration]
enabled = true
threshold-ms = 61000
format = "human"
prefix = ""
suffix = " "
color = "bright-black"

[prompt-character]
enabled = true
success = "❯"
failure = "❯"
privileged = "❯❯❯"
success-color = "green"
failure-color = "red"
privileged-color = "green"
